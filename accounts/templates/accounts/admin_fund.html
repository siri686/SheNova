{% block content %}

<style>

body{
    background: linear-gradient(135deg,#0f172a,#1e293b);
    font-family:'Segoe UI',sans-serif;
    color:#e2e8f0;
}

.sidebar{
    position:fixed;
    width:240px;
    height:100%;
    background:#020617;
    padding:25px 15px;
    box-shadow: 4px 0 20px rgba(0,0,0,0.5);
}

.sidebar h2{
    color:#38bdf8;
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:#cbd5f5;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    text-decoration:none;
}

.sidebar a:hover{
    background:rgba(56,189,248,0.2);
    color:white;
}

.main{
    margin-left:260px;
    padding:30px;
}

.card{
    background:linear-gradient(145deg,#1e293b,#0f172a);
    padding:30px;
    border-radius:16px;
    max-width:500px;
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
}

.fund-text{
    font-size:18px;
    margin:15px 0;
}

</style>

<div class="sidebar">
<h2>🎓 SheNova</h2>

<a href="{% url 'admin_dashboard' %}">🏠 Dashboard</a>
<a href="{% url 'admin_applications' %}">📄 Applications</a>
<a href="{% url 'admin_transactions' %}">💳 Transactions</a>
<a href="{% url 'admin_fund' %}">💰 Fund Management</a>
<a href="{% url 'logout' %}">🚪 Logout</a>
</div>

<div class="main">

<h2>Fund Management 💰</h2>

<div class="card">

<p class="fund-text"><strong>Total Fund:</strong> ₹{{ fund.total_fund }}</p>
<p class="fund-text"><strong>Available Fund:</strong> ₹{{ fund.available_fund }}</p>

</div>

</div>

{% endblock %}
