{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>SheNova Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ===== BODY BACKGROUND ===== */
body {
    margin: 0;
    padding: 0;
    background: url("{% static 'login_bg.png' %}") no-repeat center center;
    background-size: cover;
    height: 100vh;
}
/* ===== HEADER ===== */
.header{
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#1e3a8a;
}

.logo{
    font-size:30px;
    font-weight:700;
}

.subtitle{
    font-size:14px;
    color:#475569;
}

/* ===== MAIN ===== */
.container-main{
    margin-top:60px;
}

/* ===== LOGIN CARD ===== */
.login-card{
    background:rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius:20px;
    padding:35px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    transition:0.3s;
}

.login-card:hover{
    transform: translateY(-8px);
}

/* ===== TITLE ===== */
.login-card h4{
    font-weight:600;
    margin-bottom:25px;
    color:#1e3a8a;
}

/* ===== INPUT ===== */
.form-control{
    border-radius:12px;
    border:1px solid #e2e8f0;
    padding:12px;
    background:#f8fafc;
}

.form-control:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,0.15);
    background:white;
}

/* ===== BUTTON ===== */
.btn-primary{
    background: linear-gradient(135deg,#3b82f6,#2563eb);
    border:none;
    border-radius:12px;
    padding:12px;
    font-weight:600;
}

.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(37,99,235,0.3);
}

/* ===== LINKS ===== */
a{
    color:#2563eb;
    font-size:15px;
}

.error{
    color:red;
    text-align:center;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div>
        <div class="logo">SheNova-</div>
        <div class="subtitle">
            Smart Financial Access for Women Students
        </div>
    </div>

    <span>Secure Login Portal</span>
</div>

{% if error %}
<p class="error mt-3">{{ error }}</p>
{% endif %}

<div class="container container-main">
<div class="row justify-content-center g-4">

<!-- STUDENT LOGIN -->
<div class="col-md-4">
<form method="post" class="login-card">
{% csrf_token %}
<h4 class="text-center">Student Login</h4>

<input type="text" class="form-control mb-3" name="student_username" placeholder="Username" required>
<input type="password" class="form-control mb-3" name="student_password" id="studentPass" placeholder="Password" required>

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" onclick="togglePassword('studentPass')">
<label class="form-check-label">Show Password</label>
</div>

<button type="submit" name="role" value="student" class="btn btn-primary w-100">Login</button>

<div class="text-center mt-3">
<a href="{% url 'forgot_password' %}" class="d-block mb-1">Forgot Password?</a>
<a href="{% url 'student_register' %}" class="d-block">Register</a>
</div>
</form>
</div>

<!-- SUPERVISOR LOGIN -->
<div class="col-md-4">
<form method="post" class="login-card">
{% csrf_token %}
<h4 class="text-center">Supervisor Login</h4>

<input type="text" class="form-control mb-3" name="supervisor_username" placeholder="Username" required>
<input type="password" class="form-control mb-3" name="supervisor_password" id="supervisorPass" placeholder="Password" required>

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" onclick="togglePassword('supervisorPass')">
<label class="form-check-label">Show Password</label>
</div>

<button type="submit" name="role" value="supervisor" class="btn btn-primary w-100">Login</button>

<div class="text-center mt-3">
<a href="{% url 'forgot_password' %}" class="d-block mb-1">Forgot Password?</a>
<a href="{% url 'supervisor_register' %}" class="d-block">Register</a>
</div>
</form>
</div>

<!-- ADMIN LOGIN -->
<div class="col-md-4">
<form method="post" class="login-card">
{% csrf_token %}
<h4 class="text-center">Admin Login</h4>

<input type="text" class="form-control mb-3" name="admin_username" placeholder="Admin Username" required>
<input type="password" class="form-control mb-3" name="admin_password" id="adminPass" placeholder="Password" required>

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" onclick="togglePassword('adminPass')">
<label class="form-check-label">Show Password</label>
</div>

<button type="submit" name="role" value="admin" class="btn btn-primary w-100">Login</button>
</form>
</div>

</div>
</div>

<script>
function togglePassword(id){
    var x=document.getElementById(id);
    x.type = x.type==="password" ? "text" : "password";
}
</script>

</body>
</html>
