{% load static %}
{% block content %}

<style>

/* SAME BACKGROUND AS LOGIN */
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;

    background: url("{% static 'login_bg.png' %}") no-repeat center center;
    background-size: cover;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD STYLE */
.register-card{
    background:white;
    border-radius:20px;
    padding:30px;
    width:420px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.register-card h2{
    text-align:center;
    margin-bottom:20px;
    color:#1e3a8a;
}

/* INPUTS */
.form-control{
    border-radius:12px;
    border:1px solid #e5e7eb;
    padding:12px;
    font-size:14px;
    background:#f8fafc;
    margin-bottom:15px;
}

.form-control:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 2px rgba(59,130,246,0.2);
    background:white;
}

/* BUTTON */
.btn-custom{
    width:100%;
    border-radius:12px;
    padding:12px;
    font-weight:600;
    background:#2563eb;
    color:white;
    border:none;
}

.btn-custom:hover{
    background:#1d4ed8;
}

/* ERROR */
.error-msg{
    color:red;
    text-align:center;
    margin-top:10px;
}

/* LINK */
.login-link{
    text-align:center;
    margin-top:15px;
}

.login-link a{
    color:#2563eb;
    text-decoration:none;
}

.login-link a:hover{
    text-decoration:underline;
}

</style>

<form method="POST" class="register-card">
{% csrf_token %}

<h2>Student Register</h2>

<input class="form-control" name="full_name" placeholder="Full Name" required>
<input class="form-control" name="email" type="email" placeholder="Email" required>
<input class="form-control" name="phone" placeholder="Phone Number" required>
<input class="form-control" name="college" placeholder="College Name" required>
<input class="form-control" name="course" placeholder="Course / Department" required>

<select class="form-control" name="year" required>
<option value="">Select Year of Study</option>
<option value="1">1st Year</option>
<option value="2">2nd Year</option>
<option value="3">3rd Year</option>
<option value="4">4th Year</option>
</select>

<input class="form-control" name="username" placeholder="Username" required>
<input class="form-control" name="password" type="password" placeholder="Password" required>
<input class="form-control" name="confirm_password" type="password" placeholder="Confirm Password" required>

<button type="submit" class="btn-custom">Register</button>

{% if error %}
<p class="error-msg">{{ error }}</p>
{% endif %}

<div class="login-link">
Already have account? <a href="{% url 'login' %}">Login</a>
</div>

</form>

{% endblock %}
